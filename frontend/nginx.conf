server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаём на index.html, роутинг решает vue-router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэшируем статику с хешами в имени файла
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
